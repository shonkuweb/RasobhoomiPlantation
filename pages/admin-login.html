<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - Rasobhoomi Plantation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A4D2E;
            --primary-dark: #0F2B1A;
            --accent: #22c55e;
            --bg-gradient: linear-gradient(135deg, #09170E 0%, #0F2B1A 40%, #1A4D2E 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient background glow elements */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            left: -50px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(26, 77, 46, 0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            pointer-events: none;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--glass-shadow);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1A4D2E, #256D3B);
            border-radius: 16px;
            color: #fff;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(26, 77, 46, 0.3);
        }

        .brand-badge svg {
            width: 28px;
            height: 28px;
        }

        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0F2B1A;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-header p {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.875rem 2.875rem 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: #0f172a;
            background: #fff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #1A4D2E;
            box-shadow: 0 0 0 4px rgba(26, 77, 46, 0.12);
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #1A4D2E;
        }

        .login-btn {
            padding: 0.95rem;
            min-height: 52px;
            background: linear-gradient(135deg, #1A4D2E 0%, #153E25 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(26, 77, 46, 0.3);
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #22663d 0%, #1A4D2E 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 77, 46, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #1A4D2E;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1>RASOBHOOMI</h1>
            <p>Admin Portal</p>
        </div>

        <form class="login-form" id="login-form">
            <div class="error-msg" id="error-msg">Incorrect passcode. Please try again.</div>

            <div class="form-group">
                <label for="passcode">Admin Passcode</label>
                <div class="input-wrapper">
                    <input type="password" id="passcode" name="passcode" placeholder="Enter your admin passcode"
                        autocomplete="off" required>
                    <button type="button" class="toggle-password" id="toggle-pwd-btn" aria-label="Toggle password visibility">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                AUTHENTICATE & LOG IN
            </button>
        </form>

        <div class="back-link">
            <a href="/">← Return to Storefront</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const input = document.getElementById('passcode');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');
        const togglePwdBtn = document.getElementById('toggle-pwd-btn');
        const eyeIcon = document.getElementById('eye-icon');

        // Toggle password visibility
        togglePwdBtn.addEventListener('click', () => {
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        });

        // Check if already logged in
        const existingToken = localStorage.getItem('adminToken') || sessionStorage.getItem('adminToken');
        if (existingToken) {
            fetch('/api/auth/verify', {
                headers: { 'Authorization': `Bearer ${existingToken}` }
            }).then(res => {
                if (res.ok) {
                    localStorage.setItem('adminToken', existingToken);
                    sessionStorage.setItem('adminToken', existingToken);
                    window.location.href = '/admin';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const passcode = input.value.trim();
            if (!passcode) return;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> LOGGING IN...';
            errorMsg.classList.remove('show');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passcode })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    sessionStorage.setItem('adminToken', data.token);
                    window.location.href = '/admin';
                } else {
                    errorMsg.textContent = data.message || 'Incorrect passcode. Please try again.';
                    errorMsg.classList.add('show');
                    input.value = '';
                    input.focus();
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Please try again later.';
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'AUTHENTICATE & LOG IN';
            }
        });

        input.focus();
    </script>
</body>

</html>
